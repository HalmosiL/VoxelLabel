server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes -- always fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # index.html (and its client-side-route fallbacks above) must never
    # be served from a cache: it references the current build's hashed
    # JS/CSS filenames, so a stale cached copy silently keeps a browser
    # tab running an old bundle -- old enough, in one real case, to
    # still be missing a security/session fix that had already shipped.
    # Hashed assets under /assets/ are safe to cache hard, since a
    # content change always means a new filename.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    # PDF.js's worker is an ES module shipped as .mjs (see
    # src/components/DocumentPanel.tsx); nginx's stock mime.types has no
    # entry for it, and a module worker served as octet-stream is refused.
    types {
        text/javascript mjs;
    }
    include /etc/nginx/mime.types;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

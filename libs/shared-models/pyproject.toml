[project]
name = "shared-models"
version = "0.1.0"
description = "Shared SQLAlchemy ORM models and DB session utilities for the CT annotation platform"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.1",  # postgresql.distinct_on
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# shared_models.deid_rules (admin-service and ingestion-service)
dicom = ["pydicom>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared_models*"]

# Runs on every push and pull request: each backend service's pytest
# suite (pure-logic tests, no database needed -- see each service's
# tests/ docstrings), ruff lint on every Python package, the admin-ui and
# ct-annotator frontend type-check + production build, admin-service's
# integration tests against a real Postgres, the e2e browser suite against
# a full real stack (pull_request only -- ~15 min, see e2e/README.md), a
# `docker compose config` sanity check of the deployment file, and (on
# push to master, once every job above is green) a staging deploy.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [services/ingestion-service, services/data-service, services/annotation-service, services/admin-service, ct-annotator/backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
        working-directory: ${{ matrix.package }}

  backend:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-service, data-service, annotation-service, admin-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install
        run: |
          pip install -e libs/shared-models -e libs/shared-auth
          pip install -r services/${{ matrix.service }}/requirements.txt pytest
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  ct-annotator-backend:
    name: pytest (ct-annotator/backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ct-annotator/backend/requirements.txt
      - run: pip install -r ct-annotator/backend/requirements.txt pytest
      - run: pytest -q
        working-directory: ct-annotator/backend

  admin-ui:
    name: admin-ui build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
        working-directory: admin-ui
      - run: npm test
        working-directory: admin-ui
      - run: npm run build
        working-directory: admin-ui

  ct-annotator-frontend:
    name: ct-annotator frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ct-annotator/frontend/package-lock.json
      - run: npm ci
        working-directory: ct-annotator/frontend
      - run: npm test
        working-directory: ct-annotator/frontend
      - run: npm run build
        working-directory: ct-annotator/frontend

  integration:
    name: admin-service integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctplatform
          POSTGRES_PASSWORD: ctplatform
          POSTGRES_DB: ctplatform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ctplatform" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ctplatform:ctplatform@localhost:5432/ctplatform_test
      NOTIFICATIONS_POLLER_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/admin-service/requirements.txt
      - run: |
          pip install -e libs/shared-models -e libs/shared-auth
          pip install -r services/admin-service/requirements.txt pytest
      - run: pytest -q tests/integration
        working-directory: services/admin-service

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.proxy.yml config --quiet

  e2e:
    name: e2e (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack
        run: |
          cp .env.example .env
          docker compose up -d
          (cd ct-annotator && cp .env.example .env && docker compose up -d)
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/realms/master && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:8080/realms/master
      - name: Bootstrap (realm, migrations, object storage bucket)
        run: |
          KEYCLOAK_URL=http://localhost:8080 ADMIN_USER=admin ADMIN_PASSWORD=admin \
          ADMIN_UI_ORIGIN=http://localhost:5173 EXTRA_ORIGINS=http://localhost:5174 \
          SERVICE_ACCOUNT_CLIENT_SECRET=admin-service-account-secret \
            ./infra/keycloak/setup-dev-realm.sh
          scripts/migrate.sh
          docker compose exec -T minio sh -c "mc alias set local http://localhost:9000 minioadmin minioadmin >/dev/null && mc mb --ignore-existing local/ct-pixel-data"
          # ct-annotator's viewer saves annotations under types
          # (freehand_mask/freehand_mask_volume/segmentation_volume) that
          # only exist once registered -- see setup-test-server.sh, which
          # does this same call for a local dev stack. Without it every
          # real annotate/save in the e2e specs 404s on a fresh DB.
          python3 ct-annotator/scripts/register_annotation_type.py \
            --username platform-admin --password platform-admin \
            --keycloak-url http://localhost:8080 --admin-service-url http://localhost:8004
      - name: Seed e2e fixtures
        run: |
          pip install httpx pydicom numpy boto3
          python e2e/seed.py
      - name: Run e2e specs
        run: e2e/run.sh
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 200

  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.STAGING_HOST != ''
    needs: [lint, backend, ct-annotator-backend, admin-ui, ct-annotator-frontend, integration, compose, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ vars.STAGING_PATH }}
            git pull
            # every usage event carries the build it came from (admin-ui/vite.config.ts)
            export APP_VERSION=$(git rev-parse --short HEAD)
            docker compose build
            scripts/migrate.sh
            docker compose up -d

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: ct-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: REPLACE_WITH_REGISTRY/ingestion-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ct-platform-config
            - secretRef:
                name: ct-platform-secrets
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: ct-platform
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 80
      targetPort: 8000
---
# Runs the same image as ingestion-service but as a Celery worker instead of
# the API -- scaled independently since ingestion jobs are CPU/IO-heavy
# batch work, unlike the request/response API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: ct-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-worker
  template:
    metadata:
      labels:
        app: ingestion-worker
    spec:
      containers:
        - name: ingestion-worker
          image: REPLACE_WITH_REGISTRY/ingestion-service:latest
          command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: ct-platform-config
            - secretRef:
                name: ct-platform-secrets
